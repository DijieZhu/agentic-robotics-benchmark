# PR checks: the CHEAP layer only (no image builds, no GPU).
#
# Deliberately does NOT build task images or run tasks: those need docker, GPUs and
# minutes-to-hours, so real builds and `ale validate` stay a maintainer step before merge.
# CI here is fast, static, needs no secret, and runs on every pull request, including pull
# requests from forks. A contribution lands its task folder directly at
# tasks/<platform>/<slug>/, so every check below runs over that final path; there is no
# staging area and nothing relocates a task after merge.
#
# A task folder has the engine's Harbor-based layout: task.toml, instruction.md,
# environment/ (Dockerfile, setup/setup.sh, setup/payload/), tests/ (test.sh, verify.py,
# anchor.json, grader_config.json, the vendored robotics_grader/) and solution/solve.sh.
#
# What is gated:
#   - the pinned engine's `ale lint` over tasks/ and templates/;
#   - the registry identity cross-check for every task the committed history knows
#     (a new slug is a notice: the maintainer exports the registry after the merge);
#   - the domain lint (hardware-invariant + positive-scale metrics in tests/anchor.json,
#     isolation of the agent-visible environment/setup/payload/, image hygiene, anchor
#     provenance, a [metadata].platform from tasks/platforms.json and placement at
#     tasks/<platform>/<slug>/);
#   - the shared verify-stage kit: robotics_grader selftest + canonical-vs-vendored byte
#     equality of every tests/robotics_grader/ (a task that ships a modified kit fails here;
#     nothing re-vendors it later);
#   - every task's asset list (environment/assets.sha256) against task-assets.toml and its
#     vendored fetcher (environment/fetch_assets.py) against
#     shared/task_assets/fetch_assets.py (scripts/task_assets.py check);
#   - the pytest suite (onboarding gate, registry export and its schema, skills, template,
#     domain lint, task assets).
name: pr-checks

# `labeled` / `unlabeled` re-run the checks when a maintainer sets or lifts `ready-to-merge`:
# with that label the task-card check is strict (the merge gate, docs/task-cards.md).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

jobs:
  # The engine's own static gate, from the pinned submodule (the exact `ale lint` a
  # contributor and a maintainer run locally), plus the registry identity cross-check.
  # Static only: no docker, no episodes. vendor/ale is the public AgentsLastExam/ale
  # engine; the default token clones it. `uv run` there syncs the engine's venv from its own
  # uv.lock: the workspace packages (the `ale` CLI is ale-run's) and the default `dev` group,
  # whose jsonschema the schema check below uses. `dev` is the engine's only group, so this
  # is the same set as the `uv sync --frozen --all-groups` a contributor runs.
  engine-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: ale lint (pinned engine; tasks/ and templates/)
        run: |
          cd vendor/ale
          uv run ale lint ../../tasks
          uv run ale lint ../../templates

      # Every `gpu_types` name a GPU task lists accepts a known GPU model, by the engine's own
      # rule (a mistyped name would make the engine refuse the task on every host). A GPU task
      # without the key is a notice: it accepts every model (templates/README.md).
      - name: GPU models (gpu_types)
        run: |
          cd vendor/ale
          VIRTUAL_ENV= uv run python ../../scripts/gpu_types.py check

      # The committed identity history must describe THIS tree for every task it knows:
      # re-export with the engine's loader into throwaway paths (--allow-dirty never writes
      # the canonical history) and compare identities[0] per task against the first
      # committed record for that slug. A known slug whose identity differs means the task
      # changed after the last export, so results recorded against the registered identity
      # no longer describe the tree. A slug the history does not know is a NEW task
      # (a contribution pull request): a notice, not an error; the maintainer exports the
      # registry after the merge, which records the identity.
      - name: "Registry identity cross-check (known slugs: identities[0] == committed history)"
        run: |
          if [ ! -f identity-history.json ]; then
            echo "::notice::identity-history.json absent; no committed identity to cross-check"
            exit 0
          fi
          cd vendor/ale
          VIRTUAL_ENV= uv run python ../../scripts/export_registry.py \
            --tasks ../../tasks --history /tmp/h.json --allow-dirty --out /tmp/r.json
          # The real export against the registry's contract (the engine venv has jsonschema).
          VIRTUAL_ENV= uv run python -c 'import json, jsonschema; jsonschema.validate(json.load(open("/tmp/r.json")), json.load(open("../../schemas/task-registry.schema.json"))); print("registry export matches schemas/task-registry.schema.json")'
          cd ../..
          python3 - <<'PY'
          import json, sys
          registry = json.load(open("/tmp/r.json"))
          history = json.load(open("identity-history.json"))
          first = {}
          for record in history:
              first.setdefault(record["slug"], (record["spec_hash"], record["content_digest"]))
          bad, new = [], []
          for task in registry["tasks"]:
              current = (task["identities"][0]["spec_hash"], task["identities"][0]["content_digest"])
              committed = first.get(task["slug"])
              if committed is None:
                  new.append(task["slug"])
              elif committed != current:
                  bad.append(f"{task['slug']}: tree {current} != committed history {committed}")
          for slug in new:
              print(f"::notice::{slug}: new task, not in identity-history.json yet; "
                    "export the registry after the merge")
          for line in bad:
              print("::error::" + line)
          if bad:
              sys.exit(1)
          known = len(registry["tasks"]) - len(new)
          print(f"identity history matches the tree for {known} known task(s); {len(new)} new")
          PY

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Sync host-side deps
        run: uv sync --frozen || uv sync

      # ruff is not a project dependency (uvx fetches it); non-blocking so a style nit
      # never blocks a contribution pull request. The invariants below are the gate.
      - name: Ruff (harness / scripts)
        run: uvx ruff check harness scripts || true

      # The shared verify-stage machinery. Stdlib-only by contract, so it runs on the bare
      # system python. Upstream has no repository-kit mechanism, so the canonical copy lives
      # at shared/ and each task vendors it into tests/robotics_grader/; the diff below keeps
      # every vendored copy byte-identical to the canonical one.
      - name: robotics_grader selftest (canonical copy, shared/)
        run: |
          cd shared
          # /usr/bin/python3, not the job's activated .venv: setup-uv activates one that holds the
          # project's dependencies, and the kit must run with none (stdlib only, as in a task image).
          /usr/bin/python3 -m robotics_grader.selftest

      # A task that ships a MODIFIED kit is a job FAILURE, not a warning: the kit computes
      # every future score, and nothing re-vendors it after merge any more. The fix is one
      # copy and a re-run of `ale validate` on the contribution branch.
      - name: robotics_grader vendored copies match the canonical byte-for-byte
        run: |
          status=0
          copies=$(find tasks templates -type d -path "*/tests/robotics_grader" 2>/dev/null)
          # A find that matches nothing would pass silently (it did once, when the kit moved
          # from verify/ to tests/): the template always carries a copy, so zero is an error.
          if [ -z "$copies" ]; then
            echo "::error::no vendored kit found under tasks/*/*/tests/robotics_grader or templates/task/tests/robotics_grader"
            exit 1
          fi
          for vendored in $copies; do
            echo "--- $vendored"
            if ! diff -r --exclude=__pycache__ shared/robotics_grader "$vendored"; then
              status=1
              echo "::error file=$vendored::vendored kit differs from shared/robotics_grader. Every task carries the canonical kit at tests/robotics_grader/: run 'cp -r shared/robotics_grader/. $vendored/' and re-run ale validate before merging"
            fi
          done
          exit $status

      # Large agent-visible files come from the asset repository named once in task-assets.toml
      # (docs/task-assets.md). Each task copies that name into its environment/assets.sha256
      # (the image is built from environment/ alone, so it cannot read the repository root) and
      # vendors shared/task_assets/fetch_assets.py as environment/fetch_assets.py; a task that
      # disagrees with either is a failure: run 'python3 scripts/task_assets.py sync'.
      - name: Task assets match task-assets.toml and the canonical fetcher
        run: /usr/bin/python3 scripts/task_assets.py check

      # Every card in tasks/cards.toml (how displays name and file a task) is well formed and
      # names a task on the tree. A task without a card is a warning while a pull request is
      # under review, so a contributor's checks stay green. It is an error on main, and on a pull
      # request a maintainer has labelled `ready-to-merge`: the merge gate (docs/task-cards.md).
      - name: Task cards
        env:
          STRICT: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ready-to-merge') }}
        run: |
          if [ "$STRICT" = "true" ]; then
            uv run python scripts/task_cards.py check --strict
          else
            uv run python scripts/task_cards.py check
          fi

      - name: Pytest
        run: uv run pytest -q

      # The domain's own policy lints over tasks/ and templates/: metrics that measure the
      # machine, non-positive anchors (which invert the ratio silently), agent-visible
      # material (environment/setup/payload/) that reaches the grader in tests/, image
      # hygiene, unattributed anchors, platforms outside tasks/platforms.json, and the
      # placement of every landed task at tasks/<platform>/<slug>/. `ale lint` is generic
      # and knows none of it.
      - name: Domain lint (tasks/ and templates/, placement included)
        run: uv run python scripts/lint_domain.py .
