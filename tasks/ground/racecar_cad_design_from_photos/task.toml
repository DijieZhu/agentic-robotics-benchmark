# racecar_cad_design_from_photos: the hardware-design (CAD) stage for a tenth-scale autonomous race car (an atomic
# task). A design engineer re-creates the lost CAD of the car's made parts (23 parts in 14 shapes: moulded parts, a cut
# plate, a printed part) in FreeCAD 1.1 from one fixed photo set (rendered with Blender Cycles in a lab room: the
# complete car, a disassembly sequence, every made part on a cutting mat from both sides, close-ups) and from the given
# components: the rolling base assembly and 15 component types as STEP files with datasheets and drawings. No topology,
# no templates, no practice unit; the reference is the car as modelled (a display car). It delivers one FreeCAD
# document, /home/user/submission/racecar.FCStd: one PartDesign Body per part tag, the given components placed, one
# Assembly with the base assembly grounded and a joint to every part and component, in the assembled state.
#
# The agent drives the FreeCAD GUI session through the task's MCP server ([[environment.mcp_servers]] below; its
# execute_code runs Python inside the session); the instruction asks for it, the harness's own tools stay available, and
# verify records the tool use as statistics only.
#
# Grading (tests/verify.py, in a separate verifier sandbox: [verifier] below; every number in tests/grader_config.json;
# no agent code runs): headless FreeCAD reads the document as an unprivileged account; the car is aligned rigidly on the
# given base assembly; given components are recognised by their full shape; identical parts are matched to installed
# positions inside their family; shape 0.30, holes 0.25 (the parts' complete round holes), installation 0.20 (the given
# components' poses and the joint connections), mass properties 0.10, fit 0.15, with a shape floor; the reward is the
# design score.

schema_version = "1.4+ale.1"
artifacts = ["/home/user/submission"]

[task]
name = "grounded-intelligence-initiative/racecar_cad_design_from_photos"

[metadata]
platform = "ground"

[environment]
# The desktop is 1440x900 (`VNC_RESOLUTION` in environment/Dockerfile), and the views the agent gets are
# screenshots of it. From vendor/ale bfb7505 on, the engine starts every desktop at the run's
# `desktop_resolution` (default 1024x768) whatever the image sets, and a task cannot declare its size: run this
# task with `--set desktop_resolution=1440x900`, as it was validated and measured.
cpus = 8
memory_mb = 16384

# The FreeCAD MCP server of this task (environment/vendor/freecad-mcp, neka-nat/freecad-mcp at a pinned commit): it
# drives the FreeCAD session on the desktop through the addon's local RPC server. Tools: documents, objects (create /
# edit / delete / inspect), views (screenshots), parts library, FEM, and execute_code (Python inside FreeCAD).
[[environment.mcp_servers]]
name = "freecad"
transport = "stdio"
command = "/opt/freecad-mcp/bin/freecad-mcp"
args = ["--freecadcmd", "/opt/freecad/usr/bin/freecadcmd"]

# setup: stage the photo set and the given components' files and documents. agent: re-model the car in FreeCAD (6 h).
# verify: the verifier sandbox's start, the lockdown, the FreeCAD document read by headless FreeCAD and the grade.
[agent]
timeout_sec = 21600
network_mode = "no-network"

# Separate verification: the engine releases the agent's sandbox and scores in a fresh one started from the task image,
# into which it restores only the declared artifact (/home/user/submission, written back by root). Nothing else the
# agent left behind (a program on root's PATH, its home, its processes) reaches the grader, which runs as root. setup.sh
# does not run there; the given components the grader reads are the image's own fetched assets
# (/opt/task-assets/payload, pinned by sha256), and the made parts' reference is in tests/. The verifier runs the
# image's own desktop as the agent account; verify stops it first. Inside the limit below, the document's extraction may
# take 20 minutes and the grade 35 minutes.
[verifier]
timeout_sec = 3600
environment_mode = "separate"

[verifier.environment]
cpus = 8
memory_mb = 16384
gpus = 0
