# Grocery shelf restocking: a Franka Panda on a vertical lift restocks one gondola bay (three shelves) from a tote of
# delivered products, following a planogram and rotating the stock by date (in every restocked lane each unit's
# best-before day is no earlier than that of the unit in front of it, the expired units taken out), each lane's front
# unit faced and boxes face out. The products are known only by their
# printed look against a catalog image; the bay's pose and the old units behind the front ones must be found with the
# cameras. The grader drives the agent's controller over a stdio wire on a fixed hidden set of 12 episodes.
# Structure after tasks/arm/lab_sample_handling.

schema_version = "1.4+ale.1"
artifacts = ["/home/user/submission"]

[task]
name = "grounded-intelligence-initiative/grocery_shelf_restocking"

[metadata]
platform = "arm"

[environment]
cpus = 4
memory_mb = 12288

# 4 h. It was 2 h while the cameras were drawn by MuJoCo's own renderer; with the store aisle drawn by Filament on the
# CPU a practice run of a controller that reads the cameras takes about twice the wall time (measured with one saved
# controller on the six practice episodes, same host and image: 28.7 ms a step before, 53.2 ms now; 1978 s and 4243 s
# for the six), so the session is twice as long and affords about as many practice runs as before.
[agent]
timeout_sec = 14400
network_mode = "no-network"

# 12 episodes (2 per hidden unit), each at most 15000 control steps. The grader's budget (grader_config.json:
# 9000 s) is the controller's own time: its replies, plus 0.1 s for every image it asks for; the simulation is not
# in it, so the timeout covers both. Worst case, taken for a LOADED host (the sandbox's 4 CPUs on a machine at a
# load average of 60 and more, where these were measured): 180000 control steps at 60 ms (52 ms over a whole run of
# twelve episodes at the step cap; 33 ms on a quiet host) = 10800 s of simulation; 9000 s of controller time, of
# which every image is priced at 0.1 s while the cameras' renderer (shelf_render.py, on the CPU) needed 0.5 to
# 0.6 s for one there (0.07 to 0.25 s on a quiet host): a controller that spent its whole budget on images asks
# for 90000 of them, 45000 s beyond their price; a render process per episode, 12 x 40 s; the numerics check, the
# account clearing and the render self-test 120 s. 65400 s; with 30 % margin 85000 s. On a quiet host the same
# worst case is about 36000 s. The reference's whole verify takes 21 to 53 minutes (quiet to loaded); a run of
# twelve episodes at the step cap took 155 minutes on the loaded host.
[verifier]
timeout_sec = 86400
environment_mode = "separate"

[verifier.environment]
cpus = 4
memory_mb = 12288
gpus = 0
