# Grocery shelf restocking: a Franka Panda on a vertical lift restocks one gondola bay (three shelves) from a tote of
# delivered products, following a planogram and rotating the stock (the units already on a shelf end in front, the
# delivered ones behind them), each lane's front unit faced and boxes face out. The products are known only by their
# printed look against a catalog image; the bay's pose and the old units behind the front ones must be found with the
# cameras. The grader drives the agent's controller over a stdio wire on a fixed hidden set of 12 episodes.
# Structure after tasks/arm/lab_sample_handling.

schema_version = "1.4+ale.1"
artifacts = ["/home/user/submission"]

[task]
name = "grounded-intelligence-initiative/grocery_shelf_restocking"

[metadata]
platform = "arm"

[environment]
cpus = 4
memory_mb = 12288

# 2 h, as the appliance and lab tasks (the full simulator with three practice units is in the agent's home).
[agent]
timeout_sec = 7200
network_mode = "no-network"

# 12 episodes (2 per hidden unit), each at most 15000 control steps. The grader's budget (grader_config.json:
# 9000 s) is the controller's own time: its replies, plus 0.1 s for every image it asks for; the simulation is not
# in it, so the timeout covers both. Worst case: 180000 control steps at 45 ms (about 33 ms measured over the wire
# on a busy host) = 8100 s of simulation; 9000 s of controller time (drawing an image takes 0.03-0.08 s, less than
# its price); the numerics check, the account clearing and the render self-test 60 s. 17160 s; with 35 % margin
# 23200 s. The reference's whole verify takes about 25 minutes.
[verifier]
timeout_sec = 23400
environment_mode = "separate"

[verifier.environment]
cpus = 4
memory_mb = 12288
gpus = 0
