# Lab sample handling: a fixed Panda at a lab bench processes a worklist of capped, opaque sample tubes from its
# cameras, wrist force sensor and a bench scale: some go to named positions of a cold rack, the others are weighed and
# loaded into a fixed-angle centrifuge rotor as balanced opposite pairs with the tubes already in it, through a
# shield's single loading port (which needs the one-way rotor turned by hand, its answer to a turn hidden per unit,
# the scored units unlike the practice ones), then the lid is closed. Every instrument's pose is drawn per episode.
# The grader drives the agent's controller over a stdio wire on a fixed hidden set of 12 episodes. Structure after
# tasks/arm/kitchen_appliance_tending.

schema_version = "1.4+ale.1"
artifacts = ["/home/user/submission"]

[task]
name = "grounded-intelligence-initiative/lab_sample_handling"

[metadata]
platform = "arm"

[environment]
cpus = 4
memory_mb = 12288

# 2 h, as the appliance task; no lab trials on the hidden units (the full simulator with three practice units is
# in the agent's home).
[agent]
timeout_sec = 7200
network_mode = "no-network"

# 12 episodes (2 per hidden unit), each at most 20000 control steps; the grader's own budget is 9000 s
# (grader_config.json: the reference took up to 530 s an episode over the wire), and starting the solver, the
# egress self-test and the stops need a little more.
[verifier]
timeout_sec = 9600
environment_mode = "separate"

[verifier.environment]
cpus = 4
memory_mb = 12288
gpus = 0
