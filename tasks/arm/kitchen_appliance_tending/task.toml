# Kitchen appliance tending (draft for P3 of docs/dev/20261112-appliance-tending-task-design.md): a fixed Panda in
# front of a kitchen appliance it has not seen turns burners and the oven on and off and starts and stops the
# microwave, on requests, from its cameras and wrist force sensor. Structure after tasks/arm/arm_hidden_mechanism_box.

schema_version = "1.4+ale.1"
artifacts = ["/home/user/submission"]

# The slug still needs the owner's sign-off and the sheet's registration (design draft 2, open item).
[task]
name = "grounded-intelligence-initiative/kitchen_appliance_tending"

[metadata]
platform = "arm"

[environment]
cpus = 4
memory_mb = 12288

# 2 h for the P3 frontier trials (owner 2026-11-14: back from 1 h after trial 10); the 10 lab trials (units + 1)
# are the main limit.
[agent]
timeout_sec = 7200
network_mode = "no-network"

# 18 episodes (2 per hidden unit), each at most 3 x 1500 control steps; the grader's own budget is 6000 s
# (grader_config.json), and starting the solver, the egress self-test and the stops need a little more.
[verifier]
timeout_sec = 7200
environment_mode = "separate"

[verifier.environment]
cpus = 4
memory_mb = 12288
gpus = 0
